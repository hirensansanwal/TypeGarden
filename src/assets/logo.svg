<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    :root {
      --text-color: #1a231c;
      --stem-color: #2f6b3e;
      --leaf-color: #3d804e;
      --flower-color: #d94532;
      --flower-center: #f2c73d;
      --berry-color: #c93b4a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-color: #f2f5f2;
        --stem-color: #5ab574;
        --leaf-color: #6fc586;
        --flower-color: #fa6855;
        --flower-center: #fce67e;
        --berry-color: #eb5969;
      }
    }
  </style>

  <!-- Back Vine Segment (behind stem) -->
  <path d="M 25 50 C 27 46.5 30 43.5 32 40" fill="none" stroke="var(--stem-color)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Slender Didone Serif Letterform "T" -->
  <path fill="var(--text-color)" d="
    M 14 19.5
    C 14 17 15 14 17.5 14
    L 46.5 14
    C 49 14 50 17 50 19.5
    C 49.6 19.8 49 19.8 48.6 19.2
    C 47.8 17.8 47 16.2 44.5 16.2
    L 33.6 16.2
    L 33.6 48.8
    C 33.6 50.8 35 51.4 38.5 51.4
    L 40 51.4
    C 40.5 51.4 41 51.8 41 52.3
    L 41 52.8
    L 23 52.8
    L 23 52.3
    C 23 51.8 23.5 51.4 24 51.4
    L 25.5 51.4
    C 29 51.4 30.4 50.8 30.4 48.8
    L 30.4 16.2
    L 19.5 16.2
    C 17 16.2 16.2 17.8 15.4 19.2
    C 15 19.8 14.4 19.8 14 19.5 Z
  "/>

  <!-- Front Vine Layer (weaving across stem to crossbar) -->
  <g fill="none" stroke="var(--stem-color)" stroke-linecap="round">
    <!-- Main stem weave -->
    <path d="M 23 54 C 24 52 24.5 51 25 50 M 32 40 C 34 36 35 31 31 27 C 27 23 28 17 34 14 C 37.5 12 41 13.5 44 15" stroke-width="1.6"/>
    <!-- Delicate curling tendril tip -->
    <path d="M 44 15 C 46.5 16.5 48.5 15 47.5 13 C 46.5 11.5 44.5 12 45 13.5" stroke-width="1.1"/>
    <!-- Lower root tendril -->
    <path d="M 23 54 C 20.5 56 18 53 20.5 51 C 21.5 50 22.5 51.5 21.8 52.5" stroke-width="1.0"/>
  </g>

  <!-- Delicate Foliage Blades -->
  <!-- Leaf 1: Mid-right blade -->
  <path d="M 34 32 C 39 30.5 43 33.5 42 37 C 39 36.5 35.5 35 34 32 Z" fill="var(--leaf-color)"/>
  <!-- Leaf 2: Mid-left blade -->
  <path d="M 29 25 C 24.5 23.5 22 26.5 23.5 30 C 26 29.5 28.5 27.5 29 25 Z" fill="var(--leaf-color)"/>
  <!-- Leaf 3: Small sprout at crossbar -->
  <path d="M 35 14 C 35.5 10.5 32.5 9 31 11 C 31.5 13 33 14 35 14 Z" fill="var(--leaf-color)"/>

  <!-- Blooming 5-Petal Flower Blossom -->
  <g transform="translate(44, 15)">
    <ellipse cx="0" cy="-3.6" rx="2.0" ry="2.7" fill="var(--flower-color)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-3.6" rx="2.0" ry="2.7" fill="var(--flower-color)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-3.6" rx="2.0" ry="2.7" fill="var(--flower-color)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-3.6" rx="2.0" ry="2.7" fill="var(--flower-color)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-3.6" rx="2.0" ry="2.7" fill="var(--flower-color)" transform="rotate(288)"/>
    <!-- Center stamen -->
    <circle cx="0" cy="0" r="1.4" fill="var(--flower-center)"/>
    <circle cx="0" cy="0" r="0.6" fill="#80600c"/>
  </g>

  <!-- Berry Accents -->
  <circle cx="21" cy="48" r="1.3" fill="var(--berry-color)"/>
  <circle cx="23" cy="47" r="1.0" fill="var(--berry-color)"/>
</svg>
